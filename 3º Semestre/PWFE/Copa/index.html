<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Album da Copa do Mundo</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div id="auth-screen" class="container">
        <div class="auth-box">
            <h1>Ver album da Copa</h1>
            <p class="subtitle">Gerenciador de figurinha</p>
            
            <div class="form-group">
                <input type="email" id="auth-email" placeholder="E-mail">
                <input type="password" id="auth-senha" placeholder="Senha">
            </div>

            <div class="auth-buttons">
                <button id="btn-login" class="btn-primary">Entrar com E-mail</button>
                <button id="btn-cadastro" class="btn-secondary">Criar Conta</button>
                <div class="divider">ou</div>
                <button id="btn-google" class="btn-google">
                    <!-- <img src="https://lh3.googleusercontent.com/COxitRowZbgHe1303Yi8AJuA5hc30dIFJv2jiJa40jaAsCD2Cj1s7wC7lc797mW0Componentes" alt="" style="width:18px; margin-right:8px; display:none;"> -->
                    Entrar com o Google
                </button>
            </div>
        </div>
    </div>

    <div id="dashboard-screen" class="container wide hidden">
        <header class="main-header">
            <h2>Painel Copa do Mundo</h2>
            <div class="user-info">
                <span id="user-display-name">Carregando...</span>
                <button id="btn-logout" class="btn-logout">Sair</button>
            </div>
        </header>

        <div class="dashboard-layout">
            <section class="admin-sidebar">
                <h3>Cadastrar Nova Figurinha</h3>
                <div class="form-group">
                    <label for="jogador-imagem">Link da Imagem (Opcional)</label>
                    <input type="url" id="jogador-imagem" placeholder="http://...">

                    <label for="jogador-nome">Nome do Jogador</label>
                    <input type="text" id="jogador-nome" placeholder="Ex: Paqueta">

                    <label for="jogador-pais">Pais do Jogador</label>
                    <select id="jogador-pais">
                        <option value="Argentina">Argentina</option>
                        <option value="Brasil">Brasil</option>
                        <option value="Colombia">Colômbia</option>
                        <option value="Equador">Equador</option>
                        <option value="Paraguai">Paraguai</option>
                        <option value="Uruguai">Uruguai</option>
                        <option value="Canada">Canadá</option>
                        <option value="Estados Unidos">Estados Unidos</option>
                        <option value="Mexico">México</option>
                        <option value="Curacau">Curaçau</option>
                        <option value="Haiti">Haiti</option>
                        <option value="Panama">Panamá</option>
                        <option value="Alemanha">Alemanha</option>
                        <option value="Austria">Áustria</option>
                        <option value="Belgica">Bélgica</option>
                        <option value="Bosnia">Bósnia</option>
                        <option value="Croacia">Croácia</option>
                        <option value="Escocia">Escócia</option>
                        <option value="Espanha">Espanha</option>
                        <option value="Franca">França</option>
                        <option value="Holanda">Holanda</option>
                        <option value="Inglaterra">Inglaterra</option>
                        <option value="Noruega">Noruega</option>
                        <option value="Portugal">Portugal</option>
                        <option value="Republica Tcheca">República Tcheca</option>
                        <option value="Suecia">Suécia</option>
                        <option value="Suica">Suíça</option>
                        <option value="Turquia">Turquia</option>
                        <option value="Africa do Sul">África do Sul</option>
                        <option value="Argelia">Argélia</option>
                        <option value="Cabo Verde">Cabo Verde</option>
                        <option value="Costa do Marfim">Costa do Marfim</option>
                        <option value="Egito">Egito</option>
                        <option value="Gana">Gana</option>
                        <option value="Marrocos">Marrocos</option>
                        <option value="Republica Democratica do Congo">República Democrática do Congo</option>
                        <option value="Senegal">Senegal</option>
                        <option value="Tunisia">Tunísia</option>
                        <option value="Arabia Saudita">Arábia Saudita</option>
                        <option value="Australia">Austrália</option>
                        <option value="Catar">Catar</option>
                        <option value="Coreia do Sul">Coreia do Sul</option>
                        <option value="Ira">Irã</option>
                        <option value="Iraque">Iraque</option>
                        <option value="Japao">Japão</option>
                        <option value="Jordania">Jordânia</option>
                        <option value="Uzbequistao">Uzbequistão</option>
                        <option value="Nova Zelandia">Nova Zelândia</option>
                    </select>

                    <label for="jogador-posicao">Posição</label>
                    <input type="text" id="jogador-posicao" placeholder="Ex: Atacante">


                </div>
                <button id="btn-cadastrar" class="btn-primary">Adicionar ao Cardápio</button>
            </section>

            <section class="menu-view">
                <h3>Pizzas Cadastradas</h3>
                <div class="pizza-grid" id="pizza-grid">
                    </div>
            </section>
        </div>
    </div>

    <script type="module" src="script.js"></script>
</body>
</html>
