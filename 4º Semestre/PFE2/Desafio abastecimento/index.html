<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Histórico de Abastecimentos</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="pagina">
        <header class="cabecalho">
            <p class="subtitulo">MEU VEÍCULO</p>
            <h1>Histórico de Abastecimentos</h1>
        </header>
        <section class="informacoes">
            <div class="card">
                <p>Preço médio por litro</p>
                <h2 id="preco-medio">R$ 0,00</h2>
            </div>
            <div class="card">
                <p>Consumo médio</p>
                <h2 id="consumo-medio">0,00 km/L</h2>
            </div>
            <div class="card">
                <p>Total de abastecimentos</p>
                <h2 id="total-abastecimentos">0</h2>
            </div>
        </section>
        <section class="conteudo">
            <div class="caixa">
                <div class="titulo">
                    <div>
                        <p class="subtitulo">HISTÓRICO</p>
                        <h2>Abastecimentos</h2>
                    </div>
                    <button id="botao-adicionar" class="botao-adicionar">+</button>
                </div>
                <div id="mensagem-vazia" class="mensagem-vazia">
                    <div class="icone">🚗</div>
                    <h3>Nenhum abastecimento</h3>
                    <p>Clique no botão + para adicionar um abastecimento.</p>
                </div>
                <div id="lista-abastecimentos" class="lista">
                </div>
            </div>
        </section>
    </div>
    <div id="modal" class="modal escondido">
        <div class="fundo-modal"></div>
        <div class="janela">
            <div class="titulo-modal">
                <div>
                    <p class="subtitulo">ABASTECIMENTO</p>
                    <h2 id="titulo-modal">Novo abastecimento</h2>
                </div>
                <button id="botao-fechar" class="botao-fechar">×</button>
            </div>
            <form id="formulario">
                <input type="hidden" id="id">
                <div class="campos">
                    <label>
                        Data
                        <input type="date" id="data" required>
                    </label>
                    <label>
                        Combustível
                        <select id="combustivel" required>
                            <option value="">Selecione</option>
                            <option value="Gasolina">Gasolina</option>
                            <option value="Etanol">Etanol</option>
                            <option value="Diesel">Diesel</option>
                            <option value="Outro">Outro</option>
                        </select>
                    </label>
                    <label>
                        Litros
                        <input type="number" id="litros" placeholder="Ex.: 40"  required>
                    </label>
                    <label>
                        Valor pago
                        <input type="number" id="valor" placeholder="Ex.: 200" required>
                    </label>
                    <label class="campo-grande">
                        Quilometragem
                        <input type="number" id="quilometragem" placeholder="Ex.: 45000" required>
                    </label>
                </div>
                <p id="erro" class="erro"></p>
                <div class="botoes">
                    <button type="button" id="botao-cancelar" class="botao-cancelar">Cancelar</button>
                    <button type="submit" class="botao-salvar">Salvar</button>
                </div>
            </form>
        </div>
    </div>
</body>
<script src="script.js"></script>
</html>
